<app-navbar></app-navbar>

<div id="content">
    <main>
        <div class="table-data">
            <div class="todo">
                <div class="head-title">
                    <div class="left">
                        <h1>Comprobacion de gastos</h1>
                        <ul class="breadcrumb">
                            <li>
                                <a href="#">Home</a>
                            </li>
                            <li><i class='bx bx-chevron-right'></i></li>
                            <li>
                                <a class="active" href="#">capturas</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-data">
            <div class="todo">
                <div class="content">
                    <div class="tabs_wrapper">
                        <input type="radio" name="tabs" id="tab_1"/>
                        <label class="tab" for="tab_1">
                            <span class="title">Remision</span>
                        </label>
                        <input type="radio" name="tabs" id="tab_2"/>
                          <label class="tab" for="tab_2">
                            <span class="title">Facturados</span>
                        </label>
                        <span class="shape"></span>
                    </div>
                </div>
            </div>
            <div class="mountFull">
                <span></span>
            </div>
        </div>
        <div class="table-data">
            <div class="order">
                <section class>
                    <form action="#" class="form" [formGroup]="captureForm">
                        <div class="column">
                        
                        </div>
                        <div class="column">
                            <div class="input-box">
                                <h3>Clasificacion de partida</h3>
                                <input type="text"
                                    placeholder=""
                                    formControlName="clasificacion" required>
                                
                            </div>
                            <div class="input-box">
                                <h3>Partida</h3>
                                <input type="text"
                                    placeholder=""
                                    formControlName="partida" required>
                            </div>
                        </div>
                        <div class="column">
                            <div class="input-box">
                                <h3>Proveedor</h3>
                                <input type="text"
                                    placeholder=""
                                    formControlName="proveedor" required>
                            </div>
                            <div class="input-box" >
                                <h3>Empresa solicitante</h3>
                                <input type="text"
                                    placeholder=""
                                    formControlName="empresaSol" required>
                            </div>
                            <div class="input-box" >
                                <h3>Fuente de financiamiento</h3>
                                <input type="text"
                                    placeholder=""
                                    formControlName="financiamiento" required>
                            </div>
                            <div class="input-box" >
                                <h3>Area</h3>
                                <input type="text"
                                        placeholder=""
                                        formControlName="area" required>
                            </div>
                            <div class="input-box">
                                <h3>Tipo de pago</h3>
                                <input type="text"
                                        placeholder=""
                                        formControlName="tipoDeGasto" required>
                            </div>
                        </div>
                        <div class="column">
                            <div class="input-box">
                                <h3>Efectivo solicitado</h3>
                                <input type="intiger"
                                    placeholder="Ingresa el monto"
                                    formControlName="efectivoSol" required >
                            </div>
                            <div class="input-box">
                                <h3>Efectivo Comprobado</h3>
                                <input type="intiger"
                                    placeholder="Ingresa el monto"
                                    formControlName="efectivoComprobado" required />
                            </div>
                             <label for="file-input" class="drop-container">
                            <span class="drop-title">Drop files here</span>
                            or
                            <input type="file" accept="image/*" required="" id="file-input" formControlName="comprobante">
                          </label>
                        </div>
                        <div class="input-box address">
                            <h3>Justificación</h3>
                            <textarea type="text"
                                placeholder="Justificacion del gasto"
                                formControlName="justificacion" required></textarea>
                        </div>
                        <div class="column">
                            <button class="sucess" *ngIf="captureForm.valid"
                                (click)="capturaGasto()">Finalizar captura</button>
                            <button class="invalid" *ngIf="!captureForm.valid"
                                (click)="capturaGasto()">Finalizar
                                captura</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
</div>
